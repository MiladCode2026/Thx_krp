<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1130">
<meta name="mobile-web-app-capable" content="yes">
<title>Splitting Balls</title>
<style>
  :root { --bg:#0b1130; --card:#141c44; --field:#1a234f; --btn:#1f2a5c;
          --fg:#e8ecff; --hint:#8a93b5; --accent:#7fdbff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font-family: system-ui, Roboto, sans-serif; }
  .screen { display: none; flex-direction: column; height: 100vh; height: 100dvh;
            padding: max(16px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom)); }
  .screen.on { display: flex; }
  .body { flex: 1; overflow-y: auto; padding-bottom: 8px; }
  .bar { display: flex; gap: 8px; padding-top: 10px; }
  .grow { flex: 1; }
  h1 { font-size: 24px; margin: 4px 0; }
  h2 { font-size: 16px; color: var(--accent); margin: 20px 0 2px; }
  .hint { color: var(--hint); font-size: 13px; line-height: 1.35; margin: 3px 0; white-space: pre-line; }
  button { background: var(--btn); color: var(--fg); border: 0; border-radius: 10px;
           padding: 12px 13px; font-size: 15px; }
  button.accent { background: var(--accent); color: #05102a; font-weight: 700; }
  input { background: var(--field); color: var(--fg); border: 1px solid #2b3a7a;
          border-radius: 8px; padding: 9px; font-size: 16px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
  .row input[type=text] { width: 120px; text-align: right; }
  input.wide { width: 100%; margin-top: 6px; }
  canvas.view { display: block; margin: 10px auto; border-radius: 8px; }
  progress { width: 100%; height: 14px; accent-color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
</style>
</head>
<body>

<section id="settings" class="screen on">
  <div class="body">
    <h1>Splitting Balls</h1>
    <p class="hint">A ball bounces inside a shape. Each bounce splits it in two. Save the result as a video. Settings are remembered.</p>
    <div id="settingsList"></div>
    <button style="margin-top:22px" onclick="resetSettings()">Reset to defaults</button>
  </div>
  <div class="bar"><span class="grow"></span>
    <button onclick="toPreview()">Preview</button>
    <button class="accent" onclick="toExport()">Make video</button></div>
</section>

<section id="preview" class="screen">
  <div class="body">
    <h1>Preview</h1>
    <p class="hint" id="previewNote"></p>
    <canvas id="view" class="view"></canvas>
    <input id="scrub" type="range" min="0" value="0">
    <p class="hint" id="notes"></p>
  </div>
  <div class="bar"><button onclick="history.back()">Back</button>
    <button id="playBtn" onclick="togglePlay()">Pause</button><span class="grow"></span>
    <button class="accent" onclick="toExport()">Make video</button></div>
</section>

<section id="export" class="screen">
  <div class="body">
    <h1 id="exportTitle">Making video</h1>
    <p class="hint">Keep this screen open until it finishes. Many balls take longer.</p>
    <p id="exportStatus">Preparing…</p>
    <progress id="exportBar" max="1" value="0"></progress>
    <p class="hint" id="exportInfo"></p>
    <canvas id="doneView" class="view" hidden></canvas>
  </div>
  <div class="bar">
    <button id="cancelBtn" onclick="cancelExport = true">Cancel</button>
    <button id="newBtn" onclick="go('settings')" hidden>New</button>
    <span class="grow"></span>
    <button id="shotsBtn" onclick="saveShots()" hidden>Pictures</button>
    <button id="shareBtn" onclick="shareVideo()" hidden>Share</button>
    <button id="saveBtn" class="accent" onclick="saveVideo()" hidden>Save</button>
  </div>
</section>

<script>
// ======================= Settings =======================
// [key, label, default, gray hint]
const GROUPS = {
  shape: ["Shape", [
    ["N_EDGES", "Edges (n)", 0, "0 = circle, 3 = triangle, 4 = square, 5 = pentagon, …"],
    ["DIAMETER", "Shape diameter", 0.8, "Fraction of the frame width (or of the height, if that is smaller). A polygon fits inside a circle of this diameter"],
    ["ROTATION", "Rotation (°)", 0, "Turns a polygon counter-clockwise. 0 = flat bottom"],
    ["OUTLINE", "Outline width", 3, "Pixels for a 1080-pixel video; 0 hides the outline"],
    ["OUTLINE_COLOR", "Outline color", "#ffffff", "Any color"],
  ]],
  balls: ["Balls", [
    ["START_ANGLE", "Start angle (°)", 37, "Direction of the first ball. 0 = right, 90 = up, counter-clockwise"],
    ["SPEED", "Speed", 0.6, "Shape diameters per second. Every ball keeps this speed"],
    ["BALL_SIZE", "Ball diameter", 0.02, "Fraction of the shape diameter; 0.005–0.1"],
    ["SPLIT_ANGLE", "Split angle (°)", 8, "At a bounce the ball becomes two. They leave this many degrees to either side of the mirror direction; 1–30. 0 makes them overlap"],
    ["MAX_BALLS", "Balls (M)", 10000, "Splitting stops when this many balls exist; up to about 20000"],
    ["COLORS", "Colors", "hsv", "A colormap or a color. A colormap spreads over the balls in order of birth. Several colors (separated by spaces) repeat. One color = all balls the same. Maps: hsv, pastel, rainbow, cool, spring, summer, autumn, winter. A new ball gets a new color; old balls keep theirs"],
  ]],
  video: ["Video", [
    ["WIDTH", "Width (px)", 1080, "Vertical phone 1080; landscape 1920. Even number"],
    ["HEIGHT", "Height (px)", 1920, "Vertical phone 1920; landscape 1080. Even number. 720 × 1280 is about twice as fast"],
    ["FPS", "Frames per second", 30, "30 is standard; 60 is smoother but takes twice as long"],
    ["BG", "Background", "#050a1f", "Any color. #050a1f = night blue, #000000 = black"],
    ["BITRATE", "Bitrate (Mbit/s)", 8, "Quality and file size; 4–12"],
  ]],
  timing: ["Timing", [
    ["HOLD_SEC", "Final hold", 3, "Seconds to show the picture after M balls exist; 2–5"],
    ["MAX_SEC", "Longest video", 60, "The video stops here even if M is not reached"],
  ]],
  label: ["Label", [
    ["LABEL", "Label size", 40, "Size of the 'balls = …' text in pixels for a 1080-pixel video; 0 hides it"],
    ["LABEL_POS", "Label height", 0.97, "Height of the label's top edge from the bottom; 0.9 = 90%"],
  ]],
};
const ALL = Object.values(GROUPS).flatMap(g => g[1]);
const INT_KEYS = new Set(["N_EDGES", "WIDTH", "HEIGHT", "FPS", "MAX_BALLS"]);
const SIGNED = new Set(["START_ANGLE", "ROTATION"]);
const LIST_KEYS = new Set(["COLORS"]);
const STORE = "splitting-balls-settings";
const MUXER_URL = "https://cdn.jsdelivr.net/npm/mp4-muxer@5/+esm";

const COLORMAPS = {
  hsv: x => hsl(x * 360, 100, 50), pastel: x => hsl(x * 360, 90, 75),
  rainbow: x => rgb(Math.abs(2 * x - 0.5), Math.sin(Math.PI * x), Math.cos(Math.PI * x / 2)),
  cool: x => rgb(x, 1 - x, 1), spring: x => rgb(1, x, 1 - x), summer: x => rgb(x, 0.5 + x / 2, 0.4),
  autumn: x => rgb(1, x, 0), winter: x => rgb(0, x, 1 - x / 2),
};
function hsl(h, s, l) { return `hsl(${h.toFixed(1)},${s}%,${l}%)`; }
function rgb(r, g, b) { const c = v => Math.round(255 * Math.min(1, Math.max(0, v))); return `rgb(${c(r)},${c(g)},${c(b)})`; }
function isMap(c) { return Object.hasOwn(COLORMAPS, c); }
function validColor(c) { return isMap(c) || CSS.supports("color", c); }
function $(id) { return document.getElementById(id); }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function defaults() { const o = {}; for (const [k, , d] of ALL) o[k] = String(d); return o; }
function loadSettings() { try { return { ...defaults(), ...JSON.parse(localStorage.getItem(STORE) || "{}") }; } catch { return defaults(); } }
function saveSettings() { localStorage.setItem(STORE, JSON.stringify(state.settings)); }

const state = { settings: loadSettings() };

function readSettings() {
  const S = {}, bad = (label, raw) => { throw new Error(`${label}: '${raw}' is not valid.`); };
  for (const [, spec] of Object.values(GROUPS)) for (const [key, label, def] of spec) {
    const raw = String(state.settings[key]);
    if (LIST_KEYS.has(key)) {
      const parts = raw.split(/[\s,]+/).filter(Boolean);
      if (!parts.length) bad(label, raw);
      for (const c of parts) if (!validColor(c)) throw new Error(`Colors: '${c}' is not a colormap or color.`);
      if (parts.length > 1 && parts.some(isMap)) throw new Error("Colors: use one colormap, or a list of plain colors.");
      S[key] = parts;
    } else if (typeof def === "number") {
      const v = Number(raw);
      if (raw.trim() === "" || !isFinite(v) || (v < 0 && !SIGNED.has(key))) bad(label, raw);
      S[key] = INT_KEYS.has(key) ? Math.round(v) : v;
    } else S[key] = raw.trim();
  }
  if (!validColor(S.BG) || isMap(S.BG)) throw new Error(`Background: '${S.BG}' is not a color.`);
  if (!CSS.supports("color", S.OUTLINE_COLOR)) throw new Error(`Outline color: '${S.OUTLINE_COLOR}' is not a color.`);
  if (S.N_EDGES === 1 || S.N_EDGES === 2) throw new Error("Edges: use 0 for a circle, or 3 or more.");
  if (S.DIAMETER <= 0) throw new Error("Shape diameter must be above 0.");
  if (S.SPEED <= 0) throw new Error("Speed must be above 0.");
  if (S.BALL_SIZE <= 0 || S.BALL_SIZE >= 0.5) throw new Error("Ball diameter must be above 0 and below 0.5.");
  if (S.SPLIT_ANGLE >= 90) throw new Error("Split angle must be below 90.");
  if (S.MAX_BALLS < 1) throw new Error("Balls (M) must be at least 1.");
  if (S.MAX_SEC <= 0) throw new Error("Longest video must be above 0.");
  if (S.WIDTH % 2 || S.HEIGHT % 2 || Math.min(S.WIDTH, S.HEIGHT) < 64) throw new Error("Width and height must be even numbers of at least 64.");
  if (S.FPS < 1) throw new Error("Frames per second must be at least 1.");
  return S;
}

// ======================= Simulation =======================
// Units: the shape's circumscribed circle has diameter 1, centered at the origin.
class Sim {
  constructor(S) {
    this.S = S; this.M = S.MAX_BALLS; this.n = S.N_EDGES;
    this.R = 0.5; this.r = S.BALL_SIZE / 2; this.dt = 1 / S.FPS;
    this.cs = Math.cos(S.SPLIT_ANGLE * Math.PI / 180); this.sn = Math.sin(S.SPLIT_ANGLE * Math.PI / 180);
    this.normals = [];                                   // polygon: outward edge normals
    if (this.n >= 3) {
      for (let k = 0; k < this.n; k++) {
        const a = (-90 + S.ROTATION + 360 * k / this.n) * Math.PI / 180;
        this.normals.push([Math.cos(a), Math.sin(a), a]);
      }
      this.apo = this.R * Math.cos(Math.PI / this.n) - this.r;   // ball centers stay inside this
    } else this.apo = this.R - this.r;
    if (this.apo <= 0) throw new Error("The balls are too large for this shape.");
    const list = S.COLORS;
    if (list.length === 1 && isMap(list[0])) {
      const K = Math.min(256, this.M), map = COLORMAPS[list[0]];
      this.pal = Array.from({ length: K }, (_, q) => map(q / K)); this.mapped = true;
    } else { this.pal = list; this.mapped = false; }
    this.maxFrames = Math.round(S.MAX_SEC * S.FPS);
    this.holdFrames = Math.round(S.HOLD_SEC * S.FPS);
    this.reset();
  }

  reset() {
    const a = this.S.START_ANGLE * Math.PI / 180, v = this.S.SPEED;
    this.frame = 0; this.bounces = 0; this.balls = [];
    this.groups = Array.from({ length: this.pal.length }, () => []);
    this.add(0, 0, v * Math.cos(a), v * Math.sin(a));
    this.reached = this.balls.length >= this.M ? 0 : -1;
  }

  colorIndex(k) {   // k = birth order; a ball keeps its color for life
    return this.mapped ? Math.min(this.pal.length - 1, Math.floor(k * this.pal.length / this.M)) : k % this.pal.length;
  }

  add(x, y, vx, vy) {
    const b = { x, y, vx, vy, rem: -1, c: this.colorIndex(this.balls.length) };
    this.balls.push(b); this.groups[b.c].push(b);
    return b;
  }

  wall(b) {   // time until the ball center reaches the wall; sets this.nx, this.ny to the wall normal
    if (this.n < 3) {
      const a = b.vx * b.vx + b.vy * b.vy, p = b.x * b.vx + b.y * b.vy, c = b.x * b.x + b.y * b.y - this.apo * this.apo;
      const t = Math.max(0, (-p + Math.sqrt(Math.max(0, p * p - a * c))) / a);
      const qx = b.x + b.vx * t, qy = b.y + b.vy * t, l = Math.hypot(qx, qy) || 1;
      this.nx = qx / l; this.ny = qy / l;
      return t;
    }
    let t = Infinity;
    for (const [nx, ny] of this.normals) {
      const dn = nx * b.vx + ny * b.vy;
      if (dn <= 1e-12) continue;
      const tt = Math.max(0, (this.apo - (nx * b.x + ny * b.y)) / dn);
      if (tt < t) { t = tt; this.nx = nx; this.ny = ny; }
    }
    return t;
  }

  turn(rx, ry, sgn, nx, ny) {   // rotate the mirror direction; keep it pointing into the shape
    const s = sgn * this.sn;
    let x = rx * this.cs - ry * s, y = rx * s + ry * this.cs;
    const d = x * nx + y * ny;
    if (d > 0) { x -= 2 * d * nx; y -= 2 * d * ny; }
    return [x, y];
  }

  move(b, t) {
    for (let g = 0; g < 64 && t > 1e-12; g++) {
      const h = this.wall(b);
      if (h > t) { b.x += b.vx * t; b.y += b.vy * t; return; }
      b.x += b.vx * h; b.y += b.vy * h; t -= h; this.bounces++;
      const nx = this.nx, ny = this.ny, d = b.vx * nx + b.vy * ny;
      const rx = b.vx - 2 * d * nx, ry = b.vy - 2 * d * ny;   // mirror direction
      if (this.balls.length < this.M) {
        const c = this.turn(rx, ry, -1, nx, ny), p = this.turn(rx, ry, 1, nx, ny);
        const kid = this.add(b.x, b.y, c[0], c[1]);
        kid.rem = t;                                           // the child moves on for the rest of this frame
        b.vx = p[0]; b.vy = p[1];
      } else { b.vx = rx; b.vy = ry; }
    }
  }

  advance() {
    const B = this.balls;
    for (let i = 0; i < B.length; i++) {                       // children are appended and visited in the same pass
      const b = B[i], t = b.rem >= 0 ? b.rem : this.dt;
      b.rem = -1; this.move(b, t);
    }
    this.frame++;
    if (this.reached < 0 && B.length >= this.M) this.reached = this.frame;
  }

  done() {
    return (this.reached >= 0 && this.frame >= this.reached + this.holdFrames) || this.frame >= this.maxFrames;
  }

  seek(f) { if (f < this.frame) this.reset(); while (this.frame < f) this.advance(); }

  draw(ctx, W, H) {
    const S = this.S, px = Math.min(W, H) / 1080, D = S.DIAMETER * Math.min(W, H);
    const X = x => W / 2 + x * D, Y = y => H / 2 - y * D;
    ctx.globalAlpha = 1; ctx.fillStyle = S.BG; ctx.fillRect(0, 0, W, H);
    if (S.OUTLINE > 0) {
      ctx.strokeStyle = S.OUTLINE_COLOR; ctx.lineWidth = S.OUTLINE * px; ctx.lineJoin = "round";
      ctx.beginPath();
      if (this.n < 3) ctx.arc(W / 2, H / 2, this.R * D, 0, 2 * Math.PI);
      else this.normals.forEach(([, , a], k) => {
        const v = a + Math.PI / this.n, x = X(this.R * Math.cos(v)), y = Y(this.R * Math.sin(v));
        if (k) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      });
      ctx.closePath(); ctx.stroke();
    }
    const rr = this.r * D;
    this.groups.forEach((g, c) => {                            // one path per color
      if (!g.length) return;
      ctx.fillStyle = this.pal[c]; ctx.beginPath();
      for (const b of g) { const x = X(b.x), y = Y(b.y); ctx.moveTo(x + rr, y); ctx.arc(x, y, rr, 0, 2 * Math.PI); }
      ctx.fill();
    });
    if (S.LABEL > 0) {
      ctx.globalAlpha = 0.85; ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "top";
      ctx.font = `${S.LABEL * px}px monospace`;
      ctx.fillText(`balls = ${this.balls.length}`, W / 2, H * (1 - S.LABEL_POS));
      ctx.globalAlpha = 1;
    }
  }
}

function measure(S) {   // run once to learn the video length
  const p = new Sim(S);
  while (!p.done()) p.advance();
  return { total: p.frame + 1, reached: p.reached, balls: p.balls.length, sim: p };
}

// ======================= Screens =======================
let current = "settings";
function show(id) {
  if (current === "preview") stopPreview();
  if (current === "export" && exporting) cancelExport = true;
  document.querySelectorAll(".screen").forEach(el => el.classList.toggle("on", el.id === id));
  current = id;
  if (id === "settings") renderSettings();
  if (id === "preview") startPreview();
}
function go(id) { history.pushState({ screen: id }, ""); show(id); }
window.addEventListener("popstate", e => show(e.state?.screen || "settings"));
history.replaceState({ screen: "settings" }, "");

function renderSettings() {
  const list = $("settingsList"); list.innerHTML = "";
  for (const [title, spec] of Object.values(GROUPS)) {
    const h = document.createElement("h2"); h.textContent = title; list.append(h);
    for (const [key, label, def, hint] of spec) {
      const row = document.createElement("div"); row.className = "row";
      const lab = document.createElement("span"); lab.textContent = label; row.append(lab);
      const input = document.createElement("input");
      input.type = "text"; input.value = state.settings[key];
      input.inputMode = typeof def === "number" && !SIGNED.has(key) ? "decimal" : "text";
      input.autocapitalize = "off"; input.spellcheck = false;
      input.oninput = () => { state.settings[key] = input.value; saveSettings(); };
      list.append(row);
      if (LIST_KEYS.has(key)) { input.className = "wide"; list.append(input); } else row.append(input);
      const p = document.createElement("p"); p.className = "hint"; p.textContent = hint; list.append(p);
    }
  }
}
function resetSettings() { state.settings = defaults(); saveSettings(); renderSettings(); }

function collect() {
  try { const S = readSettings(); new Sim(S); return S; }
  catch (e) { alert(e.message); return null; }
}

function fitCanvas(cv, W, H, maxHFrac) {
  const dpr = window.devicePixelRatio || 1, availW = cv.parentElement.clientWidth || window.innerWidth - 32;
  const s = Math.min(availW / W, window.innerHeight * maxHFrac / H);
  cv.style.width = Math.round(W * s) + "px"; cv.style.height = Math.round(H * s) + "px";
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
}

function fmtTime(sec) { sec = Math.round(sec); return sec >= 60 ? `${Math.floor(sec / 60)} min ${sec % 60} s` : `${sec} s`; }

// ======================= Preview =======================
let preview = null, previewTotal = 0, playing = false, raf = 0, t0 = 0;

function toPreview() { if (collect()) go("preview"); }

async function startPreview() {
  const S = collect(); if (!S) return history.back();
  $("previewNote").textContent = "Building preview…"; $("notes").textContent = "";
  await sleep(30);
  try {
    const m = measure(S);
    preview = m.sim; previewTotal = m.total;
    $("notes").textContent = m.reached >= 0
      ? `${S.MAX_BALLS} balls after ${(m.reached / S.FPS).toFixed(1)} s. Video length: ${fmtTime(m.total / S.FPS)}.`
      : `Only ${m.balls} balls after ${S.MAX_SEC} s, so M is not reached. Raise Speed or Longest video.`;
  } catch (e) { alert(e.message); return history.back(); }
  if (current !== "preview") return;
  fitCanvas($("view"), S.WIDTH, S.HEIGHT, 0.58);
  $("scrub").max = previewTotal - 1; $("scrub").value = 0;
  $("previewNote").textContent = "Plays in real time. The saved video has every frame, even if this preview stutters.";
  playing = true; $("playBtn").textContent = "Pause"; t0 = performance.now();
  raf = requestAnimationFrame(loop);
}

function drawPreview(f) { const cv = $("view"); preview.seek(f); preview.draw(cv.getContext("2d"), cv.width, cv.height); }

function loop(now) {
  if (!playing || !preview) return;
  const f = Math.floor((now - t0) / 1000 * preview.S.FPS) % previewTotal;
  drawPreview(f); $("scrub").value = f;
  raf = requestAnimationFrame(loop);
}

function togglePlay() {
  if (!preview) return;
  if (playing) { stopPreview(); return; }
  t0 = performance.now() - Number($("scrub").value) / preview.S.FPS * 1000;
  playing = true; $("playBtn").textContent = "Pause"; raf = requestAnimationFrame(loop);
}

function stopPreview() { playing = false; cancelAnimationFrame(raf); $("playBtn").textContent = "Play"; }

$("scrub").oninput = () => { if (!preview) return; stopPreview(); drawPreview(Number($("scrub").value)); };

// ======================= Export =======================
let exporting = false, cancelExport = false, result = null;

function toExport() {
  const S = collect(); if (!S) return;
  go("export"); runExport(S);
}

async function pickConfig(S) {
  for (const codec of ["avc1.640033", "avc1.4D0033", "avc1.420033", "avc1.640028", "avc1.42001F"]) {
    const config = { codec, width: S.WIDTH, height: S.HEIGHT, bitrate: Math.round(S.BITRATE * 1e6),
                     framerate: S.FPS, avc: { format: "avc" } };
    try { const r = await VideoEncoder.isConfigSupported(config); if (r.supported) return r.config; } catch {}
  }
  throw new Error("This phone cannot make an MP4 of this size. Try 720 × 1280.");
}

function setExportButtons(done) {
  $("cancelBtn").hidden = done; $("newBtn").hidden = !done;
  for (const id of ["shotsBtn", "shareBtn", "saveBtn"]) $(id).hidden = !(done && result);
}

async function runExport(S) {
  exporting = true; cancelExport = false; result = null;
  $("exportTitle").textContent = "Making video"; $("exportStatus").textContent = "Preparing…";
  $("exportBar").value = 0; $("exportInfo").textContent = ""; $("doneView").hidden = true;
  setExportButtons(false);
  let lock = null, encoder = null;
  try {
    if (!("VideoEncoder" in window)) throw new Error("This browser cannot make videos. Please use an up-to-date Chrome over https.");
    await sleep(30);
    const m = measure(S), total = m.total, sim = new Sim(S);
    let mod;
    try { mod = await import(MUXER_URL); } catch { throw new Error("Could not load the video tool. Check your internet connection."); }
    const { Muxer, ArrayBufferTarget } = mod;
    const config = await pickConfig(S);
    const W = S.WIDTH, H = S.HEIGHT, canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d", { alpha: false });
    const muxer = new Muxer({ target: new ArrayBufferTarget(), video: { codec: "avc", width: W, height: H }, fastStart: "in-memory" });
    let encError = null;
    encoder = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => { encError = e; } });
    encoder.configure(config);
    try { lock = await navigator.wakeLock?.request("screen"); } catch {}

    const start = performance.now(), frameUs = 1e6 / S.FPS;
    for (let f = 0; f < total; f++) {
      if (cancelExport) throw new Error("CANCELLED");
      if (encError) throw encError;
      sim.draw(ctx, W, H);
      const frame = new VideoFrame(canvas, { timestamp: Math.round(f * frameUs), duration: Math.round(frameUs) });
      encoder.encode(frame, { keyFrame: f % (S.FPS * 2) === 0 });
      frame.close();
      sim.advance();
      while (encoder.encodeQueueSize > 4) await sleep(1);
      if (f % 3 === 0 || f === total - 1) {
        const done = f + 1, el = (performance.now() - start) / 1000;
        $("exportBar").value = done / total;
        $("exportStatus").textContent = `Frame ${done} of ${total}`;
        $("exportInfo").textContent = `${sim.balls.length} balls. About ${fmtTime(el / done * (total - done))} left`;
        await sleep(0);
      }
    }
    await encoder.flush(); muxer.finalize(); encoder.close(); encoder = null;

    $("exportStatus").textContent = "Making pictures…";
    const stamp = new Date().toISOString().slice(0, 16).replace(/[-:]/g, "").replace("T", "-");
    const base = `balls_${stamp}`, shots = [];
    const snaps = [...new Set([0, 0.25, 0.5, 0.75, 1].map(q => Math.round(q * (total - 1))))];
    for (const [i, f] of snaps.entries()) {
      sim.seek(f); sim.draw(ctx, W, H);
      const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
      shots.push(new File([blob], `${base}_${i + 1}_${sim.balls.length}balls.png`, { type: "image/png" }));
    }
    const video = new File([muxer.target.buffer], `${base}.mp4`, { type: "video/mp4" });
    result = { video, shots };

    $("exportTitle").textContent = "Done";
    $("exportStatus").textContent = `Video ready: ${fmtTime(total / S.FPS)} long, ${(video.size / 1e6).toFixed(1)} MB.`;
    $("exportInfo").textContent = (m.reached >= 0 ? "" : `M was not reached: ${m.balls} balls.\n`) +
      "Tap Save to keep it, Share to send it, or Pictures for the screenshots.";
    const dv = $("doneView"); dv.hidden = false;
    fitCanvas(dv, W, H, 0.45); sim.draw(dv.getContext("2d"), dv.width, dv.height);
  } catch (e) {
    try { encoder?.close(); } catch {}
    $("exportTitle").textContent = e.message === "CANCELLED" ? "Cancelled" : "Something went wrong";
    $("exportStatus").textContent = e.message === "CANCELLED" ? "The video was not finished." : String(e.message || e);
  } finally {
    exporting = false;
    try { await lock?.release(); } catch {}
    setExportButtons(true);
  }
}

function saveBlob(file) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
function saveVideo() { if (result) saveBlob(result.video); }
async function shareVideo() {
  if (!result) return;
  if (navigator.canShare?.({ files: [result.video] })) {
    try { await navigator.share({ files: [result.video], title: "Splitting balls" }); } catch {}
  } else alert("Sharing is not available here. Use Save instead.");
}
async function saveShots() {
  if (!result) return;
  if (navigator.canShare?.({ files: result.shots })) {
    try { await navigator.share({ files: result.shots, title: "Splitting balls pictures" }); } catch {}
  } else for (const f of result.shots) { saveBlob(f); await sleep(400); }
}

renderSettings();
</script>
